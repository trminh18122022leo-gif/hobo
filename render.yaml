services:
  - type: web
    name: hocbong-crawler-worker
    runtime: node
    plan: free
    region: singapore # Near Vietnam for ultra-fast latency
    buildCommand: npm install && npx prisma generate
    startCommand: npm run worker
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set from Supabase PostgreSQL URI in Render dashboard
      - key: CRAWL_API_SECRET
        sync: false # Set to your chosen secret
      - key: GEMINI_API_KEY
        sync: false
      - key: BOT_USER_AGENT
        value: "HocBongBot/1.0 (+https://hocbong.vn/bot; contact@hocbong.vn)"
