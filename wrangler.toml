name = "hobo-cron"
main = "cloudflare/worker.js"
compatibility_date = "2024-09-23"

# Cloudflare Cron Triggers:
# 1. "0 */4 * * *" -> Chạy mỗi 4 tiếng (0h, 4h, 8h, 12h, 16h, 20h UTC)
# 2. "30 2 * * *"  -> Kiểm tra link chết hàng ngày lúc 02:30 UTC (09:30 sáng VN)
[triggers]
crons = ["0 */4 * * *", "30 2 * * *"]

[observability]
enabled = true
